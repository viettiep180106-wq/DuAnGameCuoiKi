<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enemy hệ Mộc · Preview</title>
  <link rel="stylesheet" href="../EnemyWater/preview.css">
  <link rel="stylesheet" href="preview.css">
  <script src="preview.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="page-header"><h1>Enemy hệ Mộc</h1><p class="scope">7 enemy · 14 đòn</p></header>
    <div class="layout">
      <nav id="roster" class="roster" aria-label="Chọn enemy"></nav>
      <section class="panel" aria-label="Xem trước hiệu ứng">
        <header class="attack-header">
          <div><p id="enemy-name" class="enemy-name"></p><h2 id="attack-name"></h2></div>
          <div class="segmented" aria-label="Chọn đòn">
            <button type="button" id="normal">Đánh thường</button><button type="button" id="active">Active</button>
          </div>
        </header>
        <div class="viewport">
          <canvas id="stage" width="1160" height="560" aria-label="Hiệu ứng trên sàn đấu"></canvas>
          <p id="load-message" role="status">Đang tải sprite…</p>
        </div>
        <div class="controls">
          <div class="transport">
            <button type="button" id="play" class="primary">Phát</button>
            <button type="button" id="restart" aria-label="Phát từ đầu" title="Phát từ đầu">↺</button>
            <button type="button" id="back" aria-label="Lùi một khung hình">‹</button>
            <button type="button" id="forward" aria-label="Tiến một khung hình">›</button>
            <label class="control-label" for="speed">Tốc độ</label>
            <select id="speed"><option value=".25">0,25×</option><option value=".5" selected>0,5×</option><option value="1">1×</option></select>
            <output id="timecode" for="timeline"></output>
          </div>
          <div class="timeline">
            <input type="range" id="timeline" min="0" max="1" step="0.001" value="0" aria-label="Vị trí trên dòng thời gian">
            <div class="markers" id="markers" aria-label="Mốc đòn đánh"></div>
          </div>
          <div class="settings">
            <label id="scenario-label" for="scenario" hidden>Tình huống <select id="scenario"></select></label>
            <p class="event" id="event"></p>
          </div>
          <p class="description" id="description"></p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
